name: Docker and PostgreSQL
on: [push, pull_request]
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    # Disposable database for destructive migration/API integration tests.
    # Compose uses a separate database for container and browser verification.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: beer_map
          POSTGRES_PASSWORD: integration_test_only
          POSTGRES_DB: beer_map_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beer_map -d beer_map_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ls --all
      - run: npm run test:postgres
        env:
          BEER_MAP_TEST_DATABASE_URL: postgresql://beer_map:integration_test_only@localhost:5432/beer_map_test
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: compose_test_only
      - run: docker compose up --build --wait --wait-timeout 180
        env:
          POSTGRES_PASSWORD: compose_test_only
      - name: Verify container API and conditional requests
        run: node scripts/check-container.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BEER_MAP_TEST_URL: http://127.0.0.1:3000/
      - name: Container logs
        if: failure()
        run: docker compose logs
        env:
          POSTGRES_PASSWORD: compose_test_only
      - name: Stop containers
        if: always()
        run: docker compose down
        env:
          POSTGRES_PASSWORD: compose_test_only
