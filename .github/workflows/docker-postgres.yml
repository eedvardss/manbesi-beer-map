name: Docker and PostgreSQL
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: docker-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
      POSTGRES_PASSWORD: compose_test_only
      BEER_MAP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:telemetry
      - run: npm ls --all
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Create isolated integration database on the same SQL server
        run: docker compose exec -T db psql -U beer_map -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE beer_map_test'
      - run: npm run test:coverage
      - run: npm run test:postgres:coverage
        env:
          BEER_MAP_TEST_DATABASE_URL: postgresql://beer_map:compose_test_only@127.0.0.1:5432/beer_map_test
      - name: Core logic coverage gate
        run: npx c8 check-coverage --lines 90 --branches 85 --functions 90
      - name: Scan the serving image for published fixes
        run: |
          sh scripts/install-ci-tools.sh
          "$RUNNER_TEMP/beer-map-tools/trivy" image beer-map:local --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output "$RUNNER_TEMP/image-scan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-${{ github.sha }}
          path: ${{ runner.temp }}/image-scan.json
          retention-days: 7
      - name: Verify container API and conditional requests
        run: node scripts/check-container.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BEER_MAP_TEST_URL: http://127.0.0.1:3000/
      - name: Verify Kubernetes migration, isolation, reader privileges and failed upgrade recovery
        run: sh scripts/check-kubernetes.sh
      - name: Analyze this checkout on an isolated Sonar Community server
        run: |
          docker run -d --name sonar-ci --memory=3g -p 127.0.0.1:9000:9000 sonarqube@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
          node scripts/wait-sonar.mjs
          node scripts/configure-sonar.mjs
      - name: Enforce correctness and security quality gate
        run: docker run --rm --network host -e SONAR_TOKEN -e SONAR_HOST_URL=http://127.0.0.1:9000 -v "$PWD:/usr/src:ro" sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
      - name: Export the verified image for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker image inspect beer-map:local --format '{{.Id}}' > "$RUNNER_TEMP/image-id.txt"
          docker save beer-map:local -o "$RUNNER_TEMP/beer-map.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: verified-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/beer-map.tar
            ${{ runner.temp }}/image-id.txt
          compression-level: 1
          retention-days: 1
      - name: Container logs
        if: failure()
        run: docker compose logs
        env:
          POSTGRES_PASSWORD: compose_test_only
      - name: Stop containers
        if: always()
        run: |
          docker compose down
          docker rm -f sonar-ci || true
        env:
          POSTGRES_PASSWORD: compose_test_only
