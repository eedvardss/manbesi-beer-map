name: Human-approved application rollback
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Verified previous Helm revision
        required: true
      confirmation:
        description: Type ROLLBACK after reviewing the incident and schema compatibility
        required: true
permissions: {contents: read}
concurrency: {group: gcp-release, cancel-in-progress: false}
jobs:
  protection:
    permissions: {contents: read, actions: read}
    if: inputs.confirmation == 'ROLLBACK' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - run: node scripts/check-release-protection.mjs
        env: {GITHUB_TOKEN: '${{ github.token }}'}
  rollback:
    needs: protection
    if: inputs.confirmation == 'ROLLBACK' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gcp-demo
    permissions: {contents: read, id-token: write}
    env:
      HELM_DRIVER: configmap
      PROJECT: ${{ vars.GCP_PROJECT_ID || 'beermap-devops' }}
      ZONE: ${{ vars.GCP_ZONE || 'europe-north1-a' }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh scripts/install-ci-tools.sh
      - name: Validate explicit revision
        run: 'case "$REVISION" in ""|*[!0-9]*) exit 1;; esac'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: beer-map-deploy@${{ env.PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with: {version: '588.0.0', install_components: gke-gcloud-auth-plugin}
      - run: |
          gcloud container clusters get-credentials beer-map-demo --dns-endpoint --zone "$ZONE" --project "$PROJECT"
          helm rollback beer-map "$REVISION" -n beer-map --wait --timeout 3m
          kubectl -n beer-map rollout status deployment/beer-map --timeout=60s
          helm test beer-map -n beer-map --timeout 1m
