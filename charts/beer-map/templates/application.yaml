apiVersion: v1
kind: ServiceAccount
metadata: {name: beer-map}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: beer-map}
spec:
  selector: {app.kubernetes.io/name: beer-map}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: beer-map}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: beer-map}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beer-map
        beer-map/database-client: 'true'
    spec:
      serviceAccountName: beer-map
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: {{ include "beer-map.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: BEER_MAP_REQUIRE_DATABASE, value: 'true'}
            - {name: DATABASE_HOST, value: {{ .Values.database.host | quote }}}
            - {name: DATABASE_USER, value: {{ .Values.database.appUser | quote }}}
            - {name: DATABASE_NAME, value: {{ .Values.database.name | quote }}}
            - {name: DATABASE_PASSWORD_FILE, value: /secrets/password}
            {{- if .Values.telemetry.enabled }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.telemetry.endpoint | quote }}}
            - {name: BEER_MAP_VERSION, value: {{ .Values.image.tag | quote }}}
            {{- end }}
          startupProbe:
            httpGet: {path: /api/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 6
          volumeMounts:
            - {name: credentials, mountPath: /secrets, readOnly: true}
            - {name: temp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: credentials
          secret: {secretName: {{ .Values.database.appSecret }}, defaultMode: 0440}
        - name: temp
          emptyDir: {}
