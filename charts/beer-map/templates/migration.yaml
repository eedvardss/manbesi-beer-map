# PostgreSQL and both secrets must exist before installing this release.
apiVersion: batch/v1
kind: Job
metadata:
  name: beer-map-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beer-map-migrate
        beer-map/database-client: 'true'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "beer-map.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, scripts/setup-database.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: BEER_MAP_REQUIRE_DATABASE, value: 'true'}
            - {name: DATABASE_HOST, value: {{ .Values.database.host | quote }}}
            - {name: DATABASE_USER, value: {{ .Values.database.adminUser | quote }}}
            - {name: DATABASE_NAME, value: {{ .Values.database.name | quote }}}
            - {name: DATABASE_PASSWORD_FILE, value: /admin/password}
            - {name: DATABASE_APP_PASSWORD_FILE, value: /reader/password}
            - {name: DATABASE_APP_USER, value: {{ .Values.database.appUser | quote }}}
          volumeMounts:
            - {name: admin, mountPath: /admin, readOnly: true}
            - {name: reader, mountPath: /reader, readOnly: true}
            - {name: temp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
      volumes:
        - name: admin
          secret: {secretName: {{ .Values.database.adminSecret }}, defaultMode: 0440}
        - name: reader
          secret: {secretName: {{ .Values.database.appSecret }}, defaultMode: 0440}
        - name: temp
          emptyDir: {}
