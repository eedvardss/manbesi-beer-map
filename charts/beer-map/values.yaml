image:
  repository: beer-map
  tag: local
  digest: ''
  pullPolicy: IfNotPresent
replicas: 1
database:
  host: beer-map-db
  name: beer_map
  adminUser: beer_map
  appUser: beer_map_reader
  adminSecret: beer-map-db-admin
  appSecret: beer-map-db-reader
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: '1', memory: 768Mi}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: false
  className: ''
  host: ''
  tlsSecret: ''
networkPolicy: true
deployIdentity: ''
telemetry:
  enabled: false
  endpoint: http://otel-collector.observability.svc:4318
