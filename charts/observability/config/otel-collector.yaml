receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 512, spike_limit_mib: 128}
  batch: {}
exporters:
  prometheus: {endpoint: 0.0.0.0:8889}
  otlp_http/tempo: {endpoint: http://tempo:4318}
  otlp_http/loki: {endpoint: http://loki:3100/otlp}
extensions:
  health_check: {endpoint: 0.0.0.0:13133, path: /health}
service:
  extensions: [health_check]
  pipelines:
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus]}
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/tempo]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/loki]}

