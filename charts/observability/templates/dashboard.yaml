apiVersion: v1
kind: ConfigMap
metadata: {name: beer-map-grafana-dashboard}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Beer Map
        type: file
        disableDeletion: true
        editable: false
        options: {path: /etc/beer-map-dashboards}
  beer-map.json: |
    {{- .Files.Get "dashboards/beer-map.json" | nindent 4 }}
