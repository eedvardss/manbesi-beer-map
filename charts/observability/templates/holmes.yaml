{{- if .Values.holmes.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beer-map-holmes
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.holmes.gcpServiceAccount | quote }}
---
apiVersion: v1
kind: Service
metadata: {name: holmes}
spec:
  selector: {app.kubernetes.io/name: holmes}
  ports: [{name: http, port: 5050, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: holmes}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: holmes}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/holmes-config.yaml") . | sha256sum }}
      labels: {app.kubernetes.io/name: holmes}
    spec:
      serviceAccountName: beer-map-holmes
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: configure
          image: {{ .Values.holmes.bridgeImage | quote }}
          command: [sh, -c, 'mkdir -p /tmp/holmes && cp /config/* /tmp/holmes/']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: config, mountPath: /config, readOnly: true}
      containers:
        - name: holmes
          image: {{ .Values.holmes.image | quote }}
          command: [python3, -u, server.py]
          ports: [{name: http, containerPort: 5050}]
          env:
            - {name: HOME, value: /tmp}
            - {name: HOLMES_CONFIGPATH_DIR, value: /tmp/holmes}
            - {name: MODEL_LIST_FILE_LOCATION, value: /tmp/holmes/model_list.yaml}
            - {name: VERTEXAI_PROJECT, value: {{ .Values.holmes.project | quote }}}
            - {name: VERTEXAI_LOCATION, value: {{ .Values.holmes.location | quote }}}
            - {name: HOLMES_SSL_CERTFILE, value: /tls/tls.crt}
            - {name: HOLMES_SSL_KEYFILE, value: /tls/tls.key}
            - {name: SCOPED_NAMESPACES, value: 'beer-map,observability'}
            - {name: ENABLE_TELEMETRY, value: 'false'}
            - {name: ENABLE_JSON_LOGS_FORMAT, value: 'true'}
            - {name: OVERRIDE_MAX_OUTPUT_TOKEN, value: '2048'}
            - name: HOLMES_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.holmes.apiSecret }}, key: api-key}
          startupProbe:
            httpGet: {path: /healthz, port: http, scheme: HTTPS}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http, scheme: HTTPS}
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: '1', memory: 1536Mi}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: {{ .Values.holmes.tlsSecret }}, defaultMode: 0440}
        - {name: temp, emptyDir: {}}
        - name: config
          configMap: {name: holmes}
---
apiVersion: v1
kind: Service
metadata: {name: alert-investigation}
spec:
  selector: {app.kubernetes.io/name: alert-investigation}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alert-investigation}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alert-investigation}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alert-investigation}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bridge
          image: {{ .Values.holmes.bridgeImage | quote }}
          command: [node, scripts/alert-investigation.mjs]
          env:
            - {name: PORT, value: '8080'}
            - {name: TLS_CERT_FILE, value: /tls/tls.crt}
            - {name: TLS_KEY_FILE, value: /tls/tls.key}
            - {name: NODE_EXTRA_CA_CERTS, value: /tls/ca.crt}
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /api/live, port: http, scheme: HTTPS}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/live, port: http, scheme: HTTPS}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: {{ .Values.holmes.tlsSecret }}, defaultMode: 0440}
        - name: credentials
          secret: {secretName: {{ .Values.holmes.apiSecret }}, defaultMode: 0440}
{{- range $namespace := list "beer-map" "observability" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: beer-map-investigator, namespace: {{ $namespace }}}
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, services, endpoints, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: beer-map-investigator, namespace: {{ $namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: beer-map-investigator}
subjects:
  - {kind: ServiceAccount, name: beer-map-holmes, namespace: observability}
{{- end }}
{{- end }}

