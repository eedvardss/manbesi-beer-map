{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beer-map-backup
  annotations:
    iam.gke.io/gcp-service-account: {{ required "Backup service account is required" .Values.backup.serviceAccount | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: beer-map-backup-upload}
data:
  upload.py: |
    {{- .Files.Get "scripts/upload.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: beer-map-backup}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels: {app.kubernetes.io/name: beer-map-backup, beer-map/database-client: 'true'}
        spec:
          serviceAccountName: beer-map-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: {{ .Values.image | quote }}
              command: [sh, -ec, 'attempt=0; until pg_isready -q; do attempt=$((attempt + 1)); test "$attempt" -lt 30; sleep 2; done; export PGPASSWORD="$(cat /credentials/password)"; pg_dump -Fc --no-owner --no-acl -f /backup/catalog.dump; chmod 0640 /backup/catalog.dump']
              env:
                - {name: PGHOST, value: beer-map-db}
                - {name: PGDATABASE, value: {{ .Values.database | quote }}}
                - {name: PGUSER, value: {{ .Values.adminUser | quote }}}
              securityContext:
                runAsUser: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 100m, memory: 64Mi}
                limits: {cpu: '1', memory: 256Mi}
              volumeMounts:
                - {name: dump, mountPath: /backup}
                - {name: credentials, mountPath: /credentials, readOnly: true}
                - {name: temp, mountPath: /tmp}
          containers:
            - name: upload
              image: {{ .Values.backup.uploaderImage | quote }}
              command: [python3, /scripts/upload.py]
              env:
                - {name: BACKUP_BUCKET, value: {{ required "Backup bucket is required" .Values.backup.bucket | quote }}}
                - {name: HOME, value: /tmp}
                - {name: CLOUDSDK_CONFIG, value: /tmp/gcloud}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: '1', memory: 512Mi}
              volumeMounts:
                - {name: dump, mountPath: /backup, readOnly: true}
                - {name: temp, mountPath: /tmp}
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - {name: dump, emptyDir: {sizeLimit: 1Gi}}
            - {name: temp, emptyDir: {}}
            - name: script
              configMap: {name: beer-map-backup-upload}
            - name: credentials
              secret: {secretName: {{ .Values.adminSecret }}, defaultMode: 0440}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: beer-map-backup}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: beer-map-backup}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: beer-map-db}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: 169.254.169.254/32}}]
      ports: [{protocol: TCP, port: 80}]
    - ports: [{protocol: TCP, port: 443}]
{{- end }}
