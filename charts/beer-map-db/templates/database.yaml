apiVersion: v1
kind: Service
metadata:
  name: beer-map-db
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: beer-map-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: beer-map-db
spec:
  serviceName: beer-map-db
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app.kubernetes.io/name: beer-map-db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: beer-map-db}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.adminUser | quote }}}
            - {name: POSTGRES_PASSWORD_FILE, value: /secrets/password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: credentials, mountPath: /secrets, readOnly: true}
            - {name: runtime, mountPath: /var/run/postgresql}
            - {name: temp, mountPath: /tmp}
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: credentials
          secret: {secretName: {{ .Values.adminSecret }}, defaultMode: 0440}
        - name: runtime
          emptyDir: {}
        - name: temp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.storage.size }}}
{{- if .Values.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: beer-map-db}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: beer-map-db}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {beer-map/database-client: 'true'}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
{{- end }}
