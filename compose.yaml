name: beer-map

x-app: &app
  image: beer-map:local
  build:
    context: .
    args:
      VCS_REF: ${BEER_MAP_VERSION:-development}
  environment:
    DATABASE_URL: postgresql://beer_map:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/beer_map
    NODE_ENV: production
    BEER_MAP_REQUIRE_DATABASE: 'true'

services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: beer_map
      POSTGRES_DB: beer_map
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db-setup:
    <<: *app
    command: [sh, scripts/setup-database.sh]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

volumes:
  postgres_data:
