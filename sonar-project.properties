sonar.projectKey=beer-map
sonar.projectName=Beer Map
sonar.sources=app,components,lib,scripts
sonar.tests=scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs
# Native project generation is outside the Node deployment's analysis scope.
sonar.exclusions=app/data/**,app/venues.ts,app/verified-venues*.ts,app/popular-venues.ts,components/ui/**,scripts/generate-ios-project.py,**/*.test.ts,**/*.test.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=180
