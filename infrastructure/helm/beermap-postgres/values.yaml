image: mirror.gcr.io/library/postgres:17-bookworm

database: beer_map
user: beer_map
authSecret: beermap-postgres-auth

storage:
  size: 10Gi
  storageClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 1Gi
  limits:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 1Gi

clientLabel:
  key: beermap.io/postgres-client
  value: "true"

backup:
  enabled: true
  schedule: "0 2 * * *"
  timeZone: Europe/Riga
  bucket: ""
  gcpServiceAccount: ""
  uploadImage: mirror.gcr.io/curlimages/curl:8.16.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 2Gi
    limits:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 2Gi
