image:
  repository: ghcr.io/eedvardss/manbesi-beer-map
  tag: ""

imagePullSecrets:
  - name: ghcr-pull

secrets:
  postgres: beermap-postgres-auth   
  app: beermap-app-secrets          

postgres:
  host: beermap-postgres
  database: beer_map
  superuser: beer_map
  clientLabel:
    key: beermap.io/postgres-client
    value: "true"
  podLabels:
    app.kubernetes.io/name: beermap-postgres

resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 256Mi

migration:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  staticIpName: beermap-ip
  host: ""

networkPolicy:
  loadBalancerRanges:
    - 35.191.0.0/16
    - 130.211.0.0/22
  monitoringNamespace: monitoring
